[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analyst-architecture-meta"
version = "0.1.0"
description = "Starter kit for a natural-language SQL analyst over a Meta Ads-style Postgres warehouse."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "asyncpg>=0.29.0",
  "bcrypt>=4.1.0",
  "fastapi>=0.115.0",
  "litellm>=1.50.0",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.0",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
data-analyst = "data_analyst.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["data_analyst*"]

[tool.setuptools.package-data]
data_analyst = [
  "knowledge/*.md",
  "migrations/*.sql",
  "system_prompt.md",
  "sandbox-requirements.txt",
  "web/static/*",
  "web/templates/*",
]
