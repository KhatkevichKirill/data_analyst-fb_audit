<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>data_analyst</title>
  <link rel="stylesheet" href="/static/style.css?v=starter">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">data_analyst</div>
    <a class="topbar-back" href="/">← Dashboard</a>
    <div class="spacer"></div>
    <div class="user">
      <span>{{ username }}</span>
      <form method="post" action="/logout" style="display:inline">
        <button type="submit" class="link">logout</button>
      </form>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <button id="new-notebook-btn" class="primary">+ New notebook</button>
      <div class="sidebar-section">
        <div class="sidebar-section-label">My notebooks</div>
        <ul id="notebook-list-own"></ul>
      </div>
      <div id="sidebar-shared-section" class="sidebar-section" hidden>
        <div class="sidebar-section-label">Shared with me</div>
        <ul id="notebook-list-shared"></ul>
      </div>
    </aside>

    <main class="main">
      <div id="notebook-empty" class="empty">
        <p>Pick a notebook on the left, or create a new one.</p>
      </div>
      <section id="notebook" hidden>
        <div class="notebook-header">
          <h2 id="notebook-title">Untitled</h2>
          <span id="notebook-owner-label" class="notebook-owner-label"></span>
          <span class="spacer"></span>
          <button id="export-notebook-btn" class="small" title="Download a Markdown transcript of this notebook">Export</button>
          <button id="share-notebook-btn" class="small" title="Share this notebook">Share</button>
          <button id="fork-notebook-btn" class="small" title="Copy to my notebooks">Fork</button>
          <button id="delete-notebook-btn" class="danger small">Archive</button>
        </div>
        <div id="cells"></div>
        <div id="starter-questions" class="starter-questions"></div>
        <form id="new-cell-form" class="new-cell">
          <textarea id="prompt-input" placeholder="Ask a question about the meta_ads database…" rows="3" required></textarea>
          <div class="row">
            <span id="status-line" class="dim"></span>
            <div class="model-select-wrap" id="model-select-wrap">
              <select id="model-select" title="Model profile for this cell">
                <option value="">loading…</option>
              </select>
              <label class="high-stakes-label" title="Route to escalation model (if routing enabled)">
                <input type="checkbox" id="high-stakes-cb"> high-stakes
              </label>
            </div>
            <button type="submit" id="submit-btn">Run ⏎</button>
          </div>
        </form>
      </section>
    </main>
  </div>

  <script src="/static/notebook.js?v=starter"></script>
</body>
</html>
